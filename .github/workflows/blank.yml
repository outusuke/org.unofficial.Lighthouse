name: CI

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - '*.*.*'

jobs:
  build:
    name: "Build Flatpak"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Lighthouse.flatpak
          manifest-path: org.unofficial.Lighthouse.yml
          cache-key: flatpak-builder-${{ github.sha }}
      - name: Upload temporary artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: Lighthouse.flatpak

  release:
    name: "Publish Release"
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: flatpak-bundle
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: Lighthouse.flatpak
          generate_release_notes: true
          body: |
            Unofficial Flatpak of Lighthouse 1.1.0 (Hatteras Alfa), the Banjo-Kazooie PC port.
            You need your own Banjo-Kazooie ROM in .z64 format (US v1.0/v1.1, JP or PAL).

            Install:
              flatpak install --user Lighthouse.flatpak
              flatpak run org.unofficial.Lighthouse

            Put your ROM in this folder (e.g. baserom.us.v10.z64):
              ~/.var/app/org.unofficial.Lighthouse/data/Lighthouse/
            You can also drag and drop the ROM onto the game window.
